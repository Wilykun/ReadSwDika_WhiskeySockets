name: CI

on:
  push:
    branches: [ReadSwDika_V43]
  pull_request:
    branches: [ReadSwDika_V43]
  workflow_dispatch:

jobs:
  test:
    name: Install + validasi (no bug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Info versi
        run: node --version && npm --version

      - name: Install dependencies (dengan retry)
        run: |
          for i in 1 2 3; do
            echo "--- Percobaan install #$i ---"
            if npm ci --no-audit --no-fund; then
              echo "npm ci selesai tanpa error"
              break
            fi
            echo "npm ci gagal, hapus node_modules lalu coba lagi..."
            rm -rf node_modules
            sleep 5
          done

      - name: Verifikasi install lengkap
        run: |
          node -e "for (const m of ['axios','pino','sharp','@whiskeysockets/baileys']) require.resolve(m, { paths: [process.cwd()] })"
          echo "Semua modul inti ter-resolve, install lengkap"

      - name: Bulk validasi semua file .cjs
        run: npm run validate

      - name: Syntax check semua file .js
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print | xargs -n1 node --check
          echo "Semua file .js lolos syntax check"
