name: CI

on:
  push:
    branches: [ReadSwDika_V43]
  pull_request:
    branches: [ReadSwDika_V43]
  workflow_dispatch:

jobs:
  test:
    name: Install + validasi (no bug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bulk validasi semua file .cjs
        run: npm run validate

      - name: Syntax check semua file .js
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print | xargs -n1 node --check
          echo "Semua file .js lolos syntax check"
