name: CI

on:
  push:
    branches: [ReadSwDika_V43]
  pull_request:
    branches: [ReadSwDika_V43]
  workflow_dispatch:

jobs:
  test:
    name: Install + validasi (no bug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Info versi
        run: node --version && npm --version

      - name: Install dependencies (dengan retry + verifikasi)
        run: |
          # npm kadang crash di tengah install tapi exit code-nya 0,
          # jadi kelengkapan install diverifikasi manual lewat require.resolve
          for i in 1 2 3; do
            echo "--- Percobaan install #$i ---"
            rm -rf node_modules
            if [ "$i" = "2" ]; then LOGLEVEL="--loglevel verbose"; else LOGLEVEL=""; fi
            npm ci --no-audit --no-fund $LOGLEVEL > /tmp/npmci-$i.log 2>&1 || true
            echo "--- 40 baris terakhir log npm #$i ---"
            tail -40 /tmp/npmci-$i.log
            if node -e "for (const m of ['axios','pino','sharp','ws','qrcode-terminal','@whiskeysockets/baileys']) require.resolve(m, { paths: [process.cwd()] })" 2>/dev/null; then
              echo "Install lengkap dan terverifikasi"
              break
            fi
            echo "Install belum lengkap, coba lagi..."
            sleep 5
          done
          node -e "for (const m of ['axios','pino','sharp','ws','qrcode-terminal','@whiskeysockets/baileys']) require.resolve(m, { paths: [process.cwd()] })" \
            || { echo "GAGAL: install tidak lengkap setelah 3x percobaan"; exit 1; }

      - name: Bulk validasi semua file .cjs
        run: npm run validate

      - name: Syntax check semua file .js
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print | xargs -n1 node --check
          echo "Semua file .js lolos syntax check"
